<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping list</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/note.png">
</head>
<body>
    
    <div class="container">
        <header>
            <img src="images/note_.png" alt="logo">
            <h1 class="title">Shopping List</h1>
        </header>

        <form class="first-form">
            <input type="text" class="input" id="input" name="add-item" placeholder="Enter Item">
            <button type="submit" id="btn"><img src="images/pluse.png" alt="plus-icon"> Add Item</button>
        </form>

        <div class="filter">
            <input type="text" name="filter" placeholder="Filter Items">
        </div>

        <ul class="list-items"></ul>

        <button class="Clear-All">Clear All</button>

    </div>

    <script src="main.js"></script>
</body>
</html>
